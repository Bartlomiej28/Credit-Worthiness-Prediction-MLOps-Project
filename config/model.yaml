grid_search:
  class: GridSearchCV
  module: sklearn.model_selection
  params:
    cv: 3
    verbose: 1
    scoring: f1
    n_jobs: -1

model_selection:
  module_0:
    class: RandomForestClassifier
    module: sklearn.ensemble
    params:
      n_estimators: 100
      max_depth: 10
      max_features: sqrt
      random_state: 42
    search_param_grid:
      max_depth:
      - 10
      - 15
      - 20
      max_features:
      - sqrt
      - log2
      n_estimators:
      - 100
      - 200

  module_1:
    class: LogisticRegression
    module: sklearn.linear_model
    params:
      max_iter: 1000
      random_state: 42
    search_param_grid:
      C:
      - 0.01
      - 0.1
      - 1.0
      - 10.0

  module_2:
    class: GradientBoostingClassifier
    module: sklearn.ensemble
    params:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 3
      random_state: 42
    search_param_grid:
      n_estimators:
      - 100
      - 200
      learning_rate:
      - 0.05
      - 0.1
      max_depth:
      - 3
      - 5
