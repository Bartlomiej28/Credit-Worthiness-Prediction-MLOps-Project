ordinal_categories:
  checking_balance:
    - "no checking account"
    - "Rs. < 0"
    - "0 <= Rs. < 2000"
    - "Rs. >=2000"
  savings_balance:
    - "no savings account"
    - "Rs. < 1000"
    - "1000 <= Rs. < 5,000"
    - "5000 <= Rs. < 10,000"
    - "Rs. >= 10,000"
  employment_duration:
    - "not employed"
    - "less than 1 year"
    - "1 to 4 years"
    - "4 to 7 years"
    - "more than 7 years"
  residence_duration:
    - "less than a year"
    - "1 to 2 years"
    - "2 to 3 years"
    - "more than 3 years"
  foreign_worker:
    - "no"
    - "yes"

